name: Aggregate Proxies

on:
  schedule:
    - cron: '23 2 * * *'
    - cron: '37 8 * * *'
    - cron: '51 14 * * *'
  workflow_dispatch:

concurrency:
  group: proxy-aggregation
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and Merge Full Proxy Entries
        shell: bash
        run: |
          set -e
          TOTAL=0; SUCCESS=0
          TMPD=$(mktemp -d)
          > "$TMPD/all_proxies.yaml"

          while IFS= read -r url; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            TOTAL=$((TOTAL + 1))

            if curl -sL --max-time 15 --retry 2 \
               -H "User-Agent: clash.meta/1.19" \
               -o "$TMPD/src_$TOTAL" "$url" 2>/dev/null && [ -s "$TMPD/src_$TOTAL" ]; then
              SUCCESS=$((SUCCESS + 1))
              SIZE=$(wc -c < "$TMPD/src_$TOTAL")
              echo "  OK: $(echo $url | cut -c1-55)... (${SIZE}b)"

              # Extract full proxy entries using Python
              python3 << 'PYEOF' "$TMPD/src_$TOTAL" "$TMPD/all_proxies.yaml"
import sys, yaml, base64, re, json

src_file = sys.argv[1]
out_file = sys.argv[2]

with open(src_file, 'r', errors='ignore') as f:
    content = f.read()

entries = []

# Try Clash YAML format first
try:
    data = yaml.safe_load(content)
    if isinstance(data, dict) and 'proxies' in data:
        for p in data['proxies']:
            if isinstance(p, dict) and 'server' in p and 'port' in p:
                entries.append(p)
except Exception:
    pass

# Try Base64 encoded proxy list
if not entries:
    try:
        decoded = base64.b64decode(content.strip()).decode('utf-8', errors='ignore')
        for line in decoded.split('\n'):
            line = line.strip()
            if line and any(line.startswith(p) for p in ('vmess://','vless://','trojan://','ss://','ssr://','hysteria','tuic://','juicity://')):
                entries.append({'url': line, 'type': line.split('://')[0]})
    except Exception:
        pass

# Try direct proxy URLs in text
if not entries:
    for match in re.finditer(r'(vmess|vless|trojan|ss|ssr|hysteria2?|tuic|juicity|naive)://[^\s]+', content):
        url = match.group(0)
        entries.append({'url': url, 'type': url.split('://')[0]})

# Append to output
if entries:
    with open(out_file, 'a') as f:
        for e in entries:
            f.write(json.dumps(e, ensure_ascii=False) + '\n')
PYEOF
            else
              echo "  FAIL: $(echo $url | cut -c1-55)..."
            fi
          done < sub-urls.txt

          echo ""
          echo "Sources: $SUCCESS/$TOTAL ok"

          # Deduplicate by server:port or by full entry hash
          COUNT=0
          if [ -s "$TMPD/all_proxies.yaml" ]; then
            python3 << 'PYEOF' "$TMPD/all_proxies.yaml"
import sys, json

seen = set()
unique = []
with open(sys.argv[1]) as f:
    for line in f:
        line = line.strip()
        if not line: continue
        try:
            entry = json.loads(line)
            key = entry.get('server','') + ':' + str(entry.get('port',''))
            if not key or key == ':' :
                key = entry.get('url','')
            if key and key not in seen:
                seen.add(key)
                unique.append(entry)
        except json.JSONDecodeError:
            pass

# Output as YAML
print('proxies:')
count = 0
for e in unique:
    if 'server' in e and 'port' in e:
        print(f'  - {json.dumps(e, ensure_ascii=False)}')
    else:
        url = e.get('url','')
        if url:
            proto = url.split('://')[0] if '://' in url else 'vmess'
            # Extract server:port from URL
            import re
            m = re.search(r'://(?:[^@]+@)?([^:/\s]+):(\d+)', url)
            if m:
                print(f'  - {{"type":"{proto}","server":"{m.group(1)}","port":{m.group(2)},"url":"{url}"}}')
    count += 1
print(f'# Total: {count}', file=__import__('sys').stderr)
PYEOF
            COUNT=$(python3 -c "import sys; print(sum(1 for l in sys.stdin if l.startswith('  - ')))" < "$TMPD/all_proxies.yaml" 2>/dev/null || echo 0)
          else
            echo 'proxies: []' > "$TMPD/all_proxies.yaml"
          fi

          # Generate final output
          {
            echo "# ProxyHub Aggregated Proxies (full entries)"
            echo "# Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# Sources: $SUCCESS/$TOTAL"
            cat "$TMPD/all_proxies.yaml"
          } > raw-proxies.yaml

          COUNT=$(grep -c '^\s\s-\s' raw-proxies.yaml 2>/dev/null || echo 0)
          echo "Output: $COUNT unique proxy entries"
          echo "proxy_count=$COUNT" >> $GITHUB_ENV
          echo "source_count=$SUCCESS" >> $GITHUB_ENV
          rm -rf "$TMPD"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-proxies
          path: raw-proxies.yaml
          retention-days: 2

      - name: Push to Gist
        if: success()
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          if [ -z "${GIST_TOKEN:-}" ] || [ -z "${GIST_ID:-}" ]; then
            echo "SKIP: secrets not configured"; exit 0
          fi
          python3 << 'PYEOF'
import json, os

with open('raw-proxies.yaml', 'r') as f:
    content = f.read()

proxy_count = os.environ.get('proxy_count', '0')
desc = f"ProxyHub {__import__('datetime').datetime.utcnow().strftime('%Y-%m-%d %H:%M UTC')} — {proxy_count} entries"

payload = {
    'description': desc,
    'files': {'raw-proxies.yaml': {'content': content}}
}
with open('/tmp/gist_payload.json', 'w') as f:
    json.dump(payload, f, ensure_ascii=False)
print(f"Payload: {os.path.getsize('/tmp/gist_payload.json')} bytes")
PYEOF

          curl -s -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json; charset=utf-8" \
            "https://api.github.com/gists/$GIST_ID" \
            -d @/tmp/gist_payload.json
          echo ""
          echo "Pushed ${proxy_count:-0} entries to Gist"

      - name: Summary
        if: always()
        run: |
          echo "## ProxyHub Result" >> $GITHUB_STEP_SUMMARY
          echo "- Sources: ${source_count:-0}/$(grep -c '^[^#]' sub-urls.txt) ok" >> $GITHUB_STEP_SUMMARY
          echo "- Proxies: ${proxy_count:-0} full entries" >> $GITHUB_STEP_SUMMARY
