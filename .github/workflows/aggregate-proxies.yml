name: Aggregate Proxies

on:
  schedule:
    - cron: '23 2 * * *'
    - cron: '37 8 * * *'
    - cron: '51 14 * * *'
  workflow_dispatch:
  push:

concurrency:
  group: proxy-aggregation
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Run Fetcher
        run: python3 fetch_and_merge.py sub-urls.txt raw-proxies.yaml
      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-proxies
          path: raw-proxies.yaml
          retention-days: 2
      - name: Push to Gist
        if: success()
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          if [ -z "${GIST_TOKEN:-}" ] || [ -z "${GIST_ID:-}" ]; then echo "SKIP"; exit 0; fi
          python3 -c "
import json,os
with open('raw-proxies.yaml') as f: content=f.read()
desc=f'ProxyHub {__import__(\"datetime\").datetime.utcnow().strftime(\"%Y-%m-%d %H:%M UTC\")} entries'
payload={'description':desc,'files':{'raw-proxies.yaml':{'content':content}}}
with open('/tmp/payload.json','w') as f: json.dump(payload,f,ensure_ascii=False)
"
          curl -s -X PATCH -H "Authorization: token $GIST_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json; charset=utf-8" "https://api.github.com/gists/$GIST_ID" -d @/tmp/payload.json
          echo "Pushed to Gist"
      - name: Summary
        if: always()
        run: echo "## Done" >> $GITHUB_STEP_SUMMARY
