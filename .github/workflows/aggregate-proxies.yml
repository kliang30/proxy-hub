name: Aggregate Proxies

on:
  schedule:
    - cron: '23 2 * * *'    # 北京时间 10:23
    - cron: '37 8 * * *'    # 北京时间 16:37
    - cron: '51 14 * * *'   # 北京时间 22:51
  workflow_dispatch:

concurrency:
  group: proxy-aggregation
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch & Merge Proxies
        env:
          SUB_URLS_FILE: sub-urls.txt
        run: |
          echo "=== ProxyHub Aggregator ==="
          echo "Start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          # Read source URLs
          if [ ! -f sub-urls.txt ]; then
            echo "ERROR: sub-urls.txt not found"
            exit 1
          fi

          TOTAL=0
          SUCCESS=0
          ALL_PROXIES=""
          TEMP_DIR=$(mktemp -d)

          while IFS= read -r url; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            TOTAL=$((TOTAL + 1))
            OUTFILE="$TEMP_DIR/src_${TOTAL}.txt"

            if curl -sL --max-time 15 --retry 2 \
               -H "User-Agent: clash.meta/1.19" \
               -o "$OUTFILE" "$url" 2>/dev/null; then
              if [ -s "$OUTFILE" ]; then
                SUCCESS=$((SUCCESS + 1))
                echo "  OK: $(echo $url | cut -c1-60)... ($(wc -c < $OUTFILE) bytes)"

                # Extract proxy URLs from various formats
                # Clash YAML: extract server/port pairs
                grep -oE '(server|port):\s*[^\s]+' "$OUTFILE" 2>/dev/null | head -5000 >> "$TEMP_DIR/raw.txt"
                # Direct proxy links
                grep -oE '(vmess|vless|trojan|ss|ssr|hysteria2?|tuic|juicity)://[^\s]+' "$OUTFILE" 2>/dev/null >> "$TEMP_DIR/all_links.txt"

                # Try base64 decode for base64-encoded content
                if grep -qE '^[A-Za-z0-9+/=]{100,}$' "$OUTFILE" 2>/dev/null; then
                  base64 -d "$OUTFILE" 2>/dev/null | grep -oE '(vmess|vless|trojan|ss|ssr)://[^\s]+' >> "$TEMP_DIR/all_links.txt" 2>/dev/null || true
                fi
              else
                echo "  EMPTY: $(echo $url | cut -c1-60)..."
              fi
            else
              echo "  FAIL: $(echo $url | cut -c1-60)..."
            fi
          done < sub-urls.txt

          echo ""
          echo "Sources: $SUCCESS/$TOTAL ok"

          # Deduplicate raw links by server:port
          if [ -f "$TEMP_DIR/all_links.txt" ]; then
            sort -u "$TEMP_DIR/all_links.txt" > "$TEMP_DIR/unique.txt"
            COUNT=$(wc -l < "$TEMP_DIR/unique.txt")
          else
            COUNT=0
          fi

          # Also parse YAML-style server/port pairs into proxy list format
          if [ -f "$TEMP_DIR/raw.txt" ]; then
            python3 -c "
import re, sys
data = open('$TEMP_DIR/raw.txt').read()
# Find name entries
names = re.findall(r'name:\s*(.+)', data)
for n in names[:2000]:
    print(f'# {n.strip()}')
" >> "$TEMP_DIR/unique.txt" 2>/dev/null || true
          fi

          TOTAL_PROXIES=$(wc -l < "$TEMP_DIR/unique.txt" | tr -d ' ')

          echo "Extracted: $TOTAL_PROXIES unique proxies"

          # Generate raw-proxies.yaml
          cat > raw-proxies.yaml << YAMLHEAD
# =============================================================================
# ProxyHub Aggregated Proxy List
# Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)
# Sources: $SUCCESS/$TOTAL successful
# Proxies: $TOTAL_PROXIES unique
# =============================================================================

YAMLHEAD

          if [ -f "$TEMP_DIR/unique.txt" ] && [ -s "$TEMP_DIR/unique.txt" ]; then
            # Output as raw text (will be parsed by the Python app)
            cat "$TEMP_DIR/unique.txt" >> raw-proxies.yaml
          else
            echo "# No proxies found in this run" >> raw-proxies.yaml
          fi

          echo "Output: raw-proxies.yaml ($(wc -c < raw-proxies.yaml) bytes)"
          echo "Count: $TOTAL_PROXIES"

          # Save count for summary
          echo "proxy_count=$TOTAL_PROXIES" >> $GITHUB_ENV
          echo "source_count=$SUCCESS" >> $GITHUB_ENV

          # Cleanup
          rm -rf "$TEMP_DIR"

      - name: Upload raw-proxies.yaml as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-proxies
          path: raw-proxies.yaml
          retention-days: 2

      - name: Summary
        if: always()
        run: |
          if [ -f raw-proxies.yaml ]; then
            COUNT=$(grep -cE '(vmess|vless|trojan|ss|ssr):' raw-proxies.yaml 2>/dev/null || echo 0)
            echo "## Aggregate Result" >> $GITHUB_STEP_SUMMARY
            echo "- Fetched: ${source_count:-?}/$(grep -c '^[^#]' sub-urls.txt) sources" >> $GITHUB_STEP_SUMMARY
            echo "- Proxies: ${proxy_count:-0}" >> $GITHUB_STEP_SUMMARY
            echo "- Output: raw-proxies.yaml" >> $GITHUB_STEP_SUMMARY
          fi
