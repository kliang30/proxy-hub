name: Aggregate Proxies

on:
  schedule:
    - cron: '23 2 * * *'
    - cron: '37 8 * * *'
    - cron: '51 14 * * *'
  workflow_dispatch:

concurrency:
  group: proxy-aggregation
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and Merge
        shell: bash
        run: |
          set -e
          echo "=== ProxyHub ==="
          echo "Start: $(date -u)"

          TOTAL=0
          SUCCESS=0
          TMPD=$(mktemp -d)
          > "$TMPD/all.txt"

          while IFS= read -r url; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            TOTAL=$((TOTAL + 1))
            if curl -sL --max-time 15 --retry 2 -H "User-Agent: clash.meta/1.19" -o "$TMPD/src_$TOTAL" "$url" 2>/dev/null && [ -s "$TMPD/src_$TOTAL" ]; then
              SUCCESS=$((SUCCESS + 1))
              grep -oE '(vmess|vless|trojan|ss|ssr|hysteria2?|tuic|juicity)://[^[:space:]]+' "$TMPD/src_$TOTAL" 2>/dev/null >> "$TMPD/all.txt" || true
            fi
          done < sub-urls.txt

          if [ -s "$TMPD/all.txt" ]; then
            sort -u "$TMPD/all.txt" > "$TMPD/unique.txt"
            COUNT=$(wc -l < "$TMPD/unique.txt" | tr -d ' ')
          else
            COUNT=0
            > "$TMPD/unique.txt"
          fi

          echo "Sources: $SUCCESS/$TOTAL  Proxies: $COUNT"

          {
            echo "# ProxyHub Aggregated Proxies"
            echo "# Time: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# Sources: $SUCCESS/$TOTAL"
            echo "# Proxies: $COUNT"
            echo ""
            cat "$TMPD/unique.txt" 2>/dev/null || echo "# None"
          } > raw-proxies.yaml

          echo "proxy_count=$COUNT" >> $GITHUB_ENV
          echo "source_count=$SUCCESS" >> $GITHUB_ENV
          rm -rf "$TMPD"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-proxies
          path: raw-proxies.yaml
          retention-days: 2

      - name: Push to Gist
        if: success()
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          if [ -z "${GIST_TOKEN:-}" ] || [ -z "${GIST_ID:-}" ]; then
            echo "SKIP: secrets not configured"; exit 0
          fi
          B64=$(base64 -w0 raw-proxies.yaml)
          DESC="ProxyHub $(date -u +'%Y-%m-%d %H:%M UTC') — ${proxy_count:-0} proxies"
          curl -s -X PATCH -H "Authorization: token $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/gists/$GIST_ID" \
            -d "{\"description\":\"$DESC\",\"files\":{\"raw-proxies.yaml\":{\"content\":\"$B64\"}}}" > /dev/null
          echo "Pushed to Gist: ${proxy_count:-0} proxies"

      - name: Summary
        if: always()
        run: |
          echo "## ProxyHub Result" >> $GITHUB_STEP_SUMMARY
          echo "- Sources: ${source_count:-0}/$(grep -c '^[^#]' sub-urls.txt) ok" >> $GITHUB_STEP_SUMMARY
          echo "- Proxies: ${proxy_count:-0}" >> $GITHUB_STEP_SUMMARY
