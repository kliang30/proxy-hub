name: Aggregate Proxies

on:
  schedule:
    - cron: '23 2 * * *'
    - cron: '37 8 * * *'
    - cron: '51 14 * * *'
  workflow_dispatch:

concurrency:
  group: proxy-aggregation
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and Merge Proxies
        shell: bash
        run: |
          set -e
          echo "=== ProxyHub Aggregator ==="
          echo "Start: $(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [ ! -f sub-urls.txt ]; then
            echo "ERROR: sub-urls.txt not found"
            exit 1
          fi

          TOTAL=0
          SUCCESS=0
          TEMP_DIR=$(mktemp -d)
          > "$TEMP_DIR/all_links.txt"

          while IFS= read -r url; do
            [[ -z "$url" || "$url" =~ ^# ]] && continue
            TOTAL=$((TOTAL + 1))
            OUTFILE="$TEMP_DIR/src_${TOTAL}.txt"

            # Fetch source
            if curl -sL --max-time 15 --retry 2 \
               -H "User-Agent: clash.meta/1.19" \
               -o "$OUTFILE" "$url" 2>/dev/null; then
              if [ -s "$OUTFILE" ]; then
                SUCCESS=$((SUCCESS + 1))
                SIZE=$(wc -c < "$OUTFILE")
                echo "  OK: $(echo "$url" | cut -c1-55)... (${SIZE}b)"

                # Extract proxy URLs: direct links
                grep -oE '(vmess|vless|trojan|ss|ssr|hysteria2?|tuic|juicity)://[^[:space:]]+' "$OUTFILE" 2>/dev/null >> "$TEMP_DIR/all_links.txt" || true

                # Extract proxy URLs: base64 encoded content
                if grep -qE '^[A-Za-z0-9+/=]{100,}$' "$OUTFILE" 2>/dev/null; then
                  base64 -d "$OUTFILE" 2>/dev/null | grep -oE '(vmess|vless|trojan|ss|ssr)://[^[:space:]]+' >> "$TEMP_DIR/all_links.txt" 2>/dev/null || true
                fi
              else
                echo "  EMPTY: $(echo "$url" | cut -c1-55)..."
              fi
            else
              echo "  FAIL: $(echo "$url" | cut -c1-55)..."
            fi
          done < sub-urls.txt

          echo ""
          echo "Sources: $SUCCESS/$TOTAL ok"

          # Deduplicate
          if [ -f "$TEMP_DIR/all_links.txt" ] && [ -s "$TEMP_DIR/all_links.txt" ]; then
            sort -u "$TEMP_DIR/all_links.txt" > "$TEMP_DIR/unique.txt"
            COUNT=$(wc -l < "$TEMP_DIR/unique.txt" | tr -d ' ')
          else
            COUNT=0
            > "$TEMP_DIR/unique.txt"
          fi

          echo "Extracted: $COUNT unique proxies"

          # Generate raw-proxies.yaml
          {
            echo "# ============================================================================="
            echo "# ProxyHub Aggregated Proxy List"
            echo "# Generated: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "# Sources: $SUCCESS/$TOTAL successful"
            echo "# Proxies: $COUNT unique"
            echo "# ============================================================================="
            echo ""
            if [ -s "$TEMP_DIR/unique.txt" ]; then
              cat "$TEMP_DIR/unique.txt"
            else
              echo "# No proxies found in this run"
            fi
          } > raw-proxies.yaml

          echo "Output: raw-proxies.yaml ($(wc -c < raw-proxies.yaml) bytes)"

          # Store for later steps
          echo "proxy_count=$COUNT" >> $GITHUB_ENV
          echo "source_count=$SUCCESS" >> $GITHUB_ENV

          rm -rf "$TEMP_DIR"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raw-proxies
          path: raw-proxies.yaml
          retention-days: 2

      - name: Push to Gist
        if: success()
        shell: bash
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          set -e
          if [ -z "${GIST_TOKEN:-}" ] || [ -z "${GIST_ID:-}" ]; then
            echo "[SKIP] GIST_TOKEN or GIST_ID not set in repo secrets"
            exit 0
          fi

          CONTENT_B64=$(base64 -w0 raw-proxies.yaml)

          # Build JSON payload using jq if available, otherwise python
          if command -v jq &>/dev/null; then
            JSON_BODY=$(jq -n \
              --arg desc "ProxyHub $(date -u +'%Y-%m-%d %H:%M UTC') — ${proxy_count:-0} proxies" \
              --arg content "$CONTENT_B64" \
              '{description: $desc, files: {"raw-proxies.yaml": {content: $content}}}')
          else
            JSON_BODY=$(python3 -c "
import json, base64
with open('raw-proxies.yaml','rb') as f:
    content = base64.b64encode(f.read()).decode()
desc = 'ProxyHub $(date -u +'%Y-%m-%d %H:%M UTC') — ${proxy_count:-0} proxies'
print(json.dumps({'description': desc, 'files': {'raw-proxies.yaml': {'content': content}}}))
")
          fi

          echo "Pushing ${proxy_count:-0} proxies to Gist $GIST_ID..."

          RESP=$(echo "$JSON_BODY" | curl -s -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/gists/$GIST_ID" \
            -d @-)

          if echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); exit(0 if 'files' in d else 1)" 2>/dev/null; then
            echo "Gist updated successfully!"
          else
            echo "Gist update failed:"
            echo "$RESP" | head -3
            exit 1
          fi

      - name: Summary
        if: always()
        run: |
          echo "## ProxyHub Aggregation Result" >> $GITHUB_STEP_SUMMARY
          echo "- Sources: ${source_count:-?}/$(grep -c '^[^#]' sub-urls.txt || echo '?') ok" >> $GITHUB_STEP_SUMMARY
          echo "- Proxies extracted: ${proxy_count:-?}" >> $GITHUB_STEP_SUMMARY
          echo "- Output: raw-proxies.yaml" >> $GITHUB_STEP_SUMMARY
